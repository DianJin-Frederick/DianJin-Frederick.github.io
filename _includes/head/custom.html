{% include base_path %}

<!-- start custom head snippets -->

<!-- Web fonts: Newsreader (headings) + Manrope (body) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&display=swap">

<!-- Support for Academicons -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

<!-- favicon from https://commons.wikimedia.org/wiki/File:OOjs_UI_icon_academic-progressive.svg -->
<link rel="apple-touch-icon" sizes="180x180" href="{{ base_path }}/images/apple-touch-icon-180x180.png?v=2"/>
<link rel="icon" type="image/svg+xml" href="{{ base_path }}/images/favicon.svg?v=2"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-32x32.png?v=2" sizes="32x32"/>
<link rel="icon" type="image/png" href="{{ base_path }}/images/favicon-192x192.png?v=2" sizes="192x192"/>
<link rel="manifest" href="{{ base_path }}/images/manifest.json"/>
<link rel="icon" href="/images/favicon.ico?v=2"/>
<meta name="theme-color" content="#f8f3e8"/>

<!-- end custom head snippets -->

<!-- Open external links and PDFs in a new tab -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    document.querySelectorAll('a[href]').forEach(function (a) {
      var url = new URL(a.href, location.href);
      var external = /^https?:$/.test(url.protocol) && url.host !== location.host;
      var pdf = /\.pdf$/i.test(url.pathname);
      if (external || pdf) {
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
      }
    });
  });
</script>
